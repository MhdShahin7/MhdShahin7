# GitHub Actions Workflow: Generate Cyberpunk Contribution Snake for MhdShahin7

name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Cyberpunk snake animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MhdShahin7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00f0ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#140d24,#380b4e,#6d128d,#b015cc,#00f0ff
            dist/ocean.svg?color_snake=#ff007f&color_dots=#0a0612,#1e1035,#3b1b68,#7c2d92,#ff007f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
